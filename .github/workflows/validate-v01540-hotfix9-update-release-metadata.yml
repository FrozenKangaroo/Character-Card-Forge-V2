name: Validate v0.15.40-hotfix9 Updater Recovery

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v01540-hotfix9-updater-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  updater-recovery:
    name: Interrupted Release Metadata Recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v01540-hotfix9-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE_BASE_CLASS|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|Parse Error" /tmp/ccf-v01540-hotfix9-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Reproduce interrupted release metadata updater recovery
        run: bash ./tools/test_update_sh_release_metadata.sh

      - name: Recheck project.godot preservation
        run: bash ./tools/test_update_sh_project_godot.sh

      - name: Recheck hotfix8 release QA
        run: bash ./tools/test_v01540_hotfix8_release_qa.sh

      - name: Confirm hotfix9 compatibility layer remains inherited
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          target = "res://scripts/main_v01540_hotfix9.gd"
          scene = Path("scenes/main.tscn").read_text(encoding="utf-8")
          match = re.search(r'\[ext_resource path="(res://scripts/main[^\"]*\.gd)" type="Script" id="1_main"\]', scene)
          if not match:
              raise SystemExit("Could not resolve the active main script from scenes/main.tscn")

          current = match.group(1)
          visited = set()
          for _ in range(64):
              if current == target:
                  break
              if current in visited:
                  raise SystemExit("Cycle detected while following the main-shell inheritance chain")
              visited.add(current)
              path = Path(current.removeprefix("res://"))
              if not path.is_file():
                  raise SystemExit(f"Missing inherited main-shell script: {current}")
              source = path.read_text(encoding="utf-8")
              parent = re.search(r'^extends\s+"(res://[^\"]+\.gd)"\s*$', source, re.MULTILINE)
              if not parent:
                  raise SystemExit(f"The active main-shell chain ended before {target}: {current}")
              current = parent.group(1)
          else:
              raise SystemExit(f"The active main-shell chain did not reach {target}")

          manifest_path = Path("tools/regression_suites_v01540_hotfix9.json")
          if not manifest_path.is_file():
              raise SystemExit("Historical hotfix9 regression manifest is missing")
          json.loads(manifest_path.read_text(encoding="utf-8"))
          PY
          grep -F 'BUILD_DISPLAY_VERSION_V01540_HOTFIX9 := "0.15.40-hotfix9"' scripts/main_v01540_hotfix9.gd

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v01540_hotfix9.json --profile quick --godot "$(command -v godot)"
