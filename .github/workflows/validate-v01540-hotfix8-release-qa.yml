name: Validate v0.15.40-hotfix8 Release QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v01540-hotfix8-release-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  release-qa:
    name: Release Tooling + Response Compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v01540-hotfix8-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE_BASE_CLASS|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|Parse Error" /tmp/ccf-v01540-hotfix8-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Check release target and Godot 4.7.1 release gate
        run: bash ./tools/test_v01540_hotfix8_release_qa.sh

      - name: Check nested assistant response compatibility
        run: godot --headless --path . --script res://tools/test_assistant_response_shapes.gd

      - name: Recheck hotfix7 lightweight Vision diagnostics
        run: python3 ./tools/test_v01540_hotfix7_lightweight_diagnostics_strict.py

      - name: Recheck hotfix6 scrollable source sidebar
        run: python3 ./tools/test_v01540_hotfix6_scrollable_source_sidebar_strict.py

      - name: Recheck update.sh project.godot preservation
        run: bash ./tools/test_update_sh_project_godot.sh

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Confirm import leaves checkout clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Godot import created repository-visible changes:"
            git status --short
            exit 1
          fi

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --profile quick --godot "$(command -v godot)"
