name: Validate v0.20.1 Discoverability and Power-User Workflow

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0201-discoverability-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  discoverability:
    name: Creation, Quick Actions, Shortcuts and Layouts
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0201-import/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0201-import/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0201-import/config
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0201-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|UNUSED_VARIABLE|SHADOWED_VARIABLE|SHADOWED_GLOBAL_IDENTIFIER|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|INTEGER_DIVISION|Parse Error" /tmp/ccf-v0201-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run focused discoverability regression
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0201-focused/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0201-focused/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0201-focused/config
        run: timeout 360s godot --headless --path . --script res://tools/test_v0201_discoverability.gd

      - name: Recheck Library panels and current workflow routes
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0201-inherited/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0201-inherited/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0201-inherited/config
        run: |
          timeout 360s godot --headless --path . --script res://tools/test_v0200_hotfix1_library_panels.gd
          timeout 360s godot --headless --path . --script res://tools/test_v0195_text_routing.gd

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0201.json --profile quick --godot "$(command -v godot)"
