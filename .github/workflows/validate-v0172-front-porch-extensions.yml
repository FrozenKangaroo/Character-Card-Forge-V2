name: Validate v0.17.2 Front Porch Character Extensions

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0172-front-porch-extensions-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  front-porch-extensions:
    name: Optional Fields, AI Review and Round-trip Safety
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0172-import/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0172-import/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0172-import/config
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0172-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE_BASE_CLASS|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|INTEGER_DIVISION|Parse Error" /tmp/ccf-v0172-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run focused v0.17.2 regression
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0172-focused/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0172-focused/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0172-focused/config
        run: timeout 180s godot --headless --path . --script res://tools/test_v0172_front_porch_extensions.gd

      - name: Recheck v0.17.1 Collaborator evidence roles
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0171-evidence/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0171-evidence/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0171-evidence/config
        run: timeout 150s godot --headless --path . --script res://tools/test_v0171_collaborator_source_precedence.gd

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0172.json --profile quick --godot "$(command -v godot)"
