      - name: Test v0.14.12 unified Idea Generator
        run: timeout 30s godot --headless --path . --script res://tools/test_v01412_unified_idea_generator.gd

      - name: Test v0.14.13 Idea Generator point of view
        run: timeout 30s godot --headless --path . --script res://tools/test_v01413_idea_generator_pov.gd

      - name: Test v0.14.14 focused Character Builders
        run: timeout 30s godot --headless --path . --script res://tools/test_v01414_focused_builders.gd

      - name: Test v0.14.15 lorebook generation and triggers
        run: timeout 30s godot --headless --path . --script res://tools/test_v01415_lorebook_support.gd

