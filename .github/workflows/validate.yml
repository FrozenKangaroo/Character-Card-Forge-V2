name: Validate Godot project

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  validate:
    name: Parse and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Validate release metadata and JSON
        run: python3 ./tools/validate_project.py

      - name: Validate consolidated CI and retained coverage
        run: python3 ./tools/test_ci_consolidation.py

      - name: Validate the regression registry
        run: >-
          python3 ./tools/run_regression_suite.py
          --manifest ./tools/regression_suites_v0211.json
          --profile release
          --list

      - name: Import and parse with the warning gate
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-import/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-import/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-import/config
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee "${RUNNER_TEMP}/ccf-import.log"
          if grep -E "SCRIPT ERROR:|Failed to load script|UNUSED_VARIABLE|SHADOWED_VARIABLE|SHADOWED_GLOBAL_IDENTIFIER|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|INTEGER_DIVISION|Parse Error" "${RUNNER_TEMP}/ccf-import.log"; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi
