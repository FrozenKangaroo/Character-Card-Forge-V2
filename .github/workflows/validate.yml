name: Validate Godot project

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3
  GODOT_STATUS: stable

jobs:
  validate:
    name: Parse and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Validate release metadata and JSON
        run: python3 ./tools/validate_project.py

      - name: Import and parse the Godot project
        run: godot --headless --path . --import

      - name: Test generation contract dispatch
        run: godot --headless --path . --script res://tools/test_generation_contract_dispatch.gd

      - name: Test concept fidelity
        run: timeout 30s godot --headless --path . --script res://tools/test_concept_fidelity.gd

      - name: Test project draft lifecycle
        run: timeout 30s godot --headless --path . --script res://tools/test_project_lifecycle.gd

      - name: Test generation diagnostics
        run: timeout 30s godot --headless --path . --script res://tools/test_generation_diagnostics.gd

      - name: Test alternative greetings export
        run: timeout 30s godot --headless --path . --script res://tools/test_alternative_greetings.gd

      - name: Test multi-group output composition
        run: timeout 30s godot --headless --path . --script res://tools/test_multi_group_output_composition.gd

      - name: Test quiet malformed JSON handling
        run: timeout 30s godot --headless --path . --script res://tools/test_quiet_json_parser.gd

      - name: Test concise image prompt construction
        run: timeout 30s godot --headless --path . --script res://tools/test_image_prompt_concision.gd

      - name: Test default template selection
        run: timeout 30s godot --headless --path . --script res://tools/test_default_template_selection.gd

      - name: Test assistant response compatibility
        run: timeout 30s godot --headless --path . --script res://tools/test_assistant_response_shapes.gd

      - name: Test v0.13.11 vision and model capabilities
        run: timeout 30s godot --headless --path . --script res://tools/test_v01311_vision_capabilities.gd

      - name: Test v0.13.11 creative vision hotfix
        run: timeout 30s godot --headless --path . --script res://tools/test_v01311_creative_vision_hotfix.gd

      - name: Test v0.13.11 seed identifier naming
        run: timeout 30s godot --headless --path . --script res://tools/test_v01311_seed_warning_name.gd

      - name: Test v0.13.12 AI image prompt planning
        run: timeout 30s godot --headless --path . --script res://tools/test_image_prompt_generation_v01312.gd

      - name: Test v0.13.12 Image Studio startup prompt behavior
        run: timeout 30s godot --headless --path . --script res://tools/test_v01312_image_prompt_startup.gd

      - name: Test v0.14 authoring option foundation
        run: timeout 30s godot --headless --path . --script res://tools/test_v014_authoring_options.gd

      - name: Test v0.14 private interview output budget
        run: timeout 30s godot --headless --path . --script res://tools/test_v014_interview_output_budget.gd

      - name: Test v0.14 Image Studio scroll layout
        run: timeout 30s godot --headless --path . --script res://tools/test_v014_image_studio_scroll_layout.gd

      - name: Test v0.14.1 desktop layout and interview review
        run: timeout 30s godot --headless --path . --script res://tools/test_v0141_desktop_layout_interview_review.gd

      - name: Test v0.14.2 character transfer and text input
        run: timeout 30s godot --headless --path . --script res://tools/test_v0142_character_transfer_input.gd

      - name: Test v0.14.6 preview selection safety
        run: timeout 30s godot --headless --path . --script res://tools/test_v0146_preview_selection_safety.gd

      - name: Test v0.14.7 Manual Guided components and state isolation
        run: timeout 30s godot --headless --path . --script res://tools/test_v0147_manual_guided_components.gd

      - name: Test v0.14.8 Manual Guided alternative greetings
        run: timeout 30s godot --headless --path . --script res://tools/test_v0148_manual_guided_alternative_greetings.gd

      - name: Test v0.14.9 Library assignment UX
        run: timeout 30s godot --headless --path . --script res://tools/test_v0149_library_ux.gd

      - name: Test v0.14.10 related character and AI variation
        run: timeout 30s godot --headless --path . --script res://tools/test_v01410_character_derivation.gd

      - name: Test v0.14.11 Idea workflows and editable options
