name: Validate v0.20.0 Very-Large and Portable Library

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0200-large-library-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  large-library:
    name: Virtualization, Cache and Portable Storage
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0200-import/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0200-import/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0200-import/config
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0200-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|UNUSED_VARIABLE|SHADOWED_VARIABLE|SHADOWED_GLOBAL_IDENTIFIER|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|INTEGER_DIVISION|Parse Error" /tmp/ccf-v0200-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run focused large-library regression
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0200-focused/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0200-focused/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0200-focused/config
        run: timeout 360s godot --headless --path . --script res://tools/test_v0200_large_portable_library.gd

      - name: Recheck library workflow, density and project storage
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0200-library/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0200-library/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0200-library/config
        run: |
          timeout 360s godot --headless --path . --script res://tools/test_v0184_library_workflow.gd
          timeout 360s godot --headless --path . --script res://tools/test_v0191_library_density.gd
          timeout 360s godot --headless --path . --script res://tools/test_project_lifecycle.gd

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0200.json --profile quick --godot "$(command -v godot)"
