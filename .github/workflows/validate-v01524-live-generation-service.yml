name: Validate v0.15.24 live generation service

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.6.3'
  GODOT_STATUS: stable

jobs:
  live-generation-service:
    name: Live strategy-aware generation service
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project
        run: godot --headless --path . --import

      - name: Confirm import leaves checkout clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Godot import created repository-visible changes:"
            git status --short
            exit 1
          fi

      - name: Test live generation-service wiring
        run: timeout 30s godot --headless --path . --script res://tools/test_v01524_live_generation_service.gd

      - name: Recheck Safe Section generation
        run: timeout 30s godot --headless --path . --script res://tools/test_v01522_safe_section_generation.gd

      - name: Recheck token settings regression
        run: timeout 30s godot --headless --path . --script res://tools/test_v01523_token_settings_regression.gd

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --profile quick --godot "$(command -v godot)"
