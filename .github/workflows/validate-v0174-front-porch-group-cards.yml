name: Validate v0.17.4 Front Porch Group Cards

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0174-front-porch-group-cards-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  group-cards:
    name: Format, Artwork, Remapping and Live UI
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0174-import/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0174-import/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0174-import/config
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0174-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE_BASE_CLASS|SHADOWED_GLOBAL_IDENTIFIER|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|INTEGER_DIVISION|Parse Error" /tmp/ccf-v0174-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run focused Front Porch group-card regression
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0174-focused/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0174-focused/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0174-focused/config
        run: timeout 240s godot --headless --path . --script res://tools/test_v0174_front_porch_group_cards.gd

      - name: Recheck OpenRouter image hotfix
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0173-hotfix1/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0173-hotfix1/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0173-hotfix1/config
        run: timeout 180s godot --headless --path . --script res://tools/test_v0173_hotfix1_openrouter_images.gd

      - name: Recheck Front Porch direct character install
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0173/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0173/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0173/config
        run: timeout 180s godot --headless --path . --script res://tools/test_v0173_front_porch_direct_install.gd

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0174.json --profile quick --godot "$(command -v godot)"
