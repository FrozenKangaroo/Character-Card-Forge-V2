name: Validate regression suite

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  regression:
    name: Complete inherited compatibility baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import project classes for isolated regression job
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-regression-import/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-regression-import/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-regression-import/config
        run: godot --headless --path . --import

      - name: Run the complete versioned regression profile
        run: >-
          python3 ./tools/run_regression_suite.py
          --manifest ./tools/regression_suites_v0211.json
          --profile release
          --godot "$(command -v godot)"
