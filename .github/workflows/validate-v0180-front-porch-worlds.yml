name: Validate v0.18.0 Front Porch Worlds

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0180-front-porch-worlds-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  worlds:
    name: fpworld, Lore, Climate, Review and Live UI
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0180-import/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0180-import/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0180-import/config
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0180-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE|SHADOWED_GLOBAL_IDENTIFIER|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|INTEGER_DIVISION|Parse Error" /tmp/ccf-v0180-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run focused Front Porch Worlds regression
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0180-focused/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0180-focused/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0180-focused/config
        run: timeout 240s godot --headless --path . --script res://tools/test_v0180_front_porch_worlds.gd

      - name: Recheck Front Porch avatar galleries
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0175/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0175/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0175/config
        run: timeout 240s godot --headless --path . --script res://tools/test_v0175_front_porch_avatar_galleries.gd

      - name: Recheck export-readiness safety
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0175-safety/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0175-safety/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0175-safety/config
        run: timeout 240s godot --headless --path . --script res://tools/test_v0175_hotfix2_export_safety.gd

      - name: Recheck Godot warning cleanup
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0175-warnings/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0175-warnings/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0175-warnings/config
        run: timeout 120s godot --headless --path . --script res://tools/test_v0175_hotfix3_warning_cleanup.gd

      - name: Recheck Front Porch group cards
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0174/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0174/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0174/config
        run: timeout 240s godot --headless --path . --script res://tools/test_v0174_front_porch_group_cards.gd

      - name: Recheck direct character install
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0173/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0173/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0173/config
        run: timeout 180s godot --headless --path . --script res://tools/test_v0173_front_porch_direct_install.gd

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0180.json --profile quick --godot "$(command -v godot)"
