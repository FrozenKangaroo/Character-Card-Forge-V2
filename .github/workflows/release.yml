name: Build tagged release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/public-idea-source-publish/*.ccfideasource.txt"
  workflow_dispatch:
    inputs:
      operation:
        description: Deployment operation to run
        required: true
        default: build-release
        type: choice
        options:
          - build-release
          - publish-public-idea-sources
      tag:
        description: Existing v-prefixed tag to build (release operation)
        required: false
        type: string
      source_paths:
        description: Repo-relative .ccfideasource.txt paths (public-source operation)
        required: false
        type: string

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1
  GODOT_STATUS: stable

jobs:
  build-release:
    name: Export and publish desktop builds
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'build-release')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Resolve release tag
        id: release_tag
        env:
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ -z "${MANUAL_TAG}" ]]; then
              echo "::error::The build-release operation requires an existing v-prefixed tag."
              exit 1
            fi
            echo "tag=${MANUAL_TAG}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${PUSH_TAG}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0

      - name: Install Godot and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Validate tag, metadata, and JSON
        run: |
          python3 ./tools/validate_project.py --tag "${{ steps.release_tag.outputs.tag }}"
          python3 ./tools/release_readiness_v0204.py \
            --tag "${{ steps.release_tag.outputs.tag }}"

      - name: Import and parse the Godot project
        run: godot --headless --path . --import

      - name: Export Windows x86-64
        run: |
          mkdir -p build/windows
          godot --headless --path . \
            --export-release "Windows Desktop" \
            build/windows/CharacterCardForge.exe

      - name: Export Linux x86-64
        run: |
          mkdir -p build/linux
          godot --headless --path . \
            --export-release "Linux x86_64" \
            build/linux/CharacterCardForge.x86_64
          chmod +x build/linux/CharacterCardForge.x86_64

      - name: Export unsigned macOS Universal
        run: |
          mkdir -p build/macos
          godot --headless --path . \
            --export-release "macOS Universal" \
            build/macos/CharacterCardForge.zip

      - name: Package downloads and checksums
        run: ./tools/package_release.sh

      - name: Verify packages and prepare reviewed release notes
        run: |
          python3 ./tools/release_readiness_v0204.py \
            --tag "${{ steps.release_tag.outputs.tag }}" \
            --artifacts dist \
            --write-notes "${RUNNER_TEMP}/release-notes.md"

      - name: Upload build artifacts for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: CharacterCardForge-${{ steps.release_tag.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Character Card Forge ${RELEASE_TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag

  publish-public-idea-sources:
    name: Publish public Idea Sources to R2
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-public-idea-sources')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: public-idea-source-r2-publish
      cancel-in-progress: false
    env:
      R2_BUCKET: charactercardforge
      PUBLIC_ROOT_URL: https://charactercardforge.damee.info
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      MANUAL_SOURCE_PATHS: ${{ inputs.source_paths }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install R2 client dependency
        run: python -m pip install --disable-pip-version-check boto3

      - name: Validate R2 configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret."; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::Missing R2_ACCESS_KEY_ID secret."; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::Missing R2_SECRET_ACCESS_KEY secret."; exit 1; }

      - name: Collect source snapshots
        id: sources
        shell: bash
        run: |
          set -euo pipefail
          list_file="$RUNNER_TEMP/public-idea-source-files.txt"
          : > "$list_file"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' "$MANUAL_SOURCE_PATHS" \
              | tr ' ' '\n' \
              | sed '/^[[:space:]]*$/d' \
              >> "$list_file"
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]]; then
              git diff-tree --no-commit-id --name-only --diff-filter=AMR -r "$GITHUB_SHA" -- \
                '.github/public-idea-source-publish/*.ccfideasource.txt' >> "$list_file"
            else
              git diff --name-only --diff-filter=AMR "$before" "$GITHUB_SHA" -- \
                '.github/public-idea-source-publish/*.ccfideasource.txt' >> "$list_file"
            fi
          fi

          sort -u -o "$list_file" "$list_file"
          if [[ ! -s "$list_file" ]]; then
            echo "::error::No public Idea Source snapshots were selected."
            exit 1
          fi

          while IFS= read -r source_path; do
            case "$source_path" in
              .github/public-idea-source-publish/*.ccfideasource.txt) ;;
              *)
                echo "::error::Unsafe source path: $source_path"
                exit 1
                ;;
            esac
            test -f "$source_path" || { echo "::error::Source does not exist: $source_path"; exit 1; }
          done < "$list_file"

          echo "list_file=$list_file" >> "$GITHUB_OUTPUT"
          {
            echo "### Public Idea Source snapshots"
            sed 's/^/- `/; s/$/`/' "$list_file"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish immutable objects and manifest
        shell: bash
        env:
          R2_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.us.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          mapfile -t source_files < "${{ steps.sources.outputs.list_file }}"
          python tools/publish_public_idea_sources_r2.py \
            --bucket "$R2_BUCKET" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --public-root-url "$PUBLIC_ROOT_URL" \
            "${source_files[@]}"
