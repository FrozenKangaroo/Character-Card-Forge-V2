name: Validate v0.15.11 visible Vision analysis

on:
  pull_request:
    paths:
      - 'scripts/ui/character_collaborator_window_v01511.gd'
      - 'scripts/ui/workspace_v01511.gd'
      - 'scripts/main_v01511.gd'
      - 'scenes/main.tscn'
      - 'tools/test_v01511_visible_vision_analysis.gd'
      - '.github/workflows/validate-v01511-visible-vision-analysis.yml'
  workflow_dispatch:

jobs:
  visible-vision-analysis:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: '4.6.3'
      GODOT_STATUS: stable
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: ./tools/setup_godot_ci.sh
      - name: Import and parse project
        run: godot --headless --path . --import
      - name: Test v0.15.11 visible Vision analysis
        run: timeout 30s godot --headless --path . --script res://tools/test_v01511_visible_vision_analysis.gd
