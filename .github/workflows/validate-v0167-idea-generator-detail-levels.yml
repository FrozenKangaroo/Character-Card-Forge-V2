name: Validate v0.16.7 Idea Generator Detail Levels

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0167-idea-generator-detail-levels-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  idea-generator-detail-levels:
    name: Idea Generator detail levels
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0167-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE_BASE_CLASS|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|INTEGER_DIVISION|Parse Error" /tmp/ccf-v0167-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run focused v0.16.7 regression
        run: timeout 90s godot --headless --path . --script res://tools/test_v0167_idea_generator_detail_levels.gd

      - name: Recheck v0.16.6 ComfyUI Generation Profiles
        run: timeout 90s godot --headless --path . --script res://tools/test_v0166_comfyui_generation_profiles.gd

      - name: Recheck v0.16.5 local checkpoint profiles
        run: timeout 75s godot --headless --path . --script res://tools/test_v0165_local_sd_profiles.gd

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0167.json --profile quick --godot "$(command -v godot)"
