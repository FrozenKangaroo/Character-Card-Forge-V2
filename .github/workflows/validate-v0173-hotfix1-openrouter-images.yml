name: Validate v0.17.3-hotfix1 OpenRouter Images

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0173-hotfix1-openrouter-images-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  openrouter-images:
    name: Native Route, Discovery, Diagnostics and Compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0173-hotfix1-import/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0173-hotfix1-import/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0173-hotfix1-import/config
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0173-hotfix1-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE_BASE_CLASS|SHADOWED_GLOBAL_IDENTIFIER|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|INTEGER_DIVISION|Parse Error" /tmp/ccf-v0173-hotfix1-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run focused OpenRouter Images regression
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0173-hotfix1-focused/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0173-hotfix1-focused/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0173-hotfix1-focused/config
        run: timeout 180s godot --headless --path . --script res://tools/test_v0173_hotfix1_openrouter_images.gd

      - name: Recheck v0.16.4 dynamic provider capabilities
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0164-dynamic/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0164-dynamic/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0164-dynamic/config
        run: timeout 180s godot --headless --path . --script res://tools/test_v0164_dynamic_image_model_capabilities.gd

      - name: Recheck v0.17.3 Front Porch release behavior
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0173-front-porch/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0173-front-porch/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0173-front-porch/config
        run: timeout 180s godot --headless --path . --script res://tools/test_v0173_front_porch_direct_install.gd

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0173_hotfix1.json --profile quick --godot "$(command -v godot)"
