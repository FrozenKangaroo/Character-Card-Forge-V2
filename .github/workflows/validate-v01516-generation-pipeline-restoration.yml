name: Validate v0.15.16 generation pipeline restoration

on:
  pull_request:
    paths:
      - 'scripts/services/generation_service_v01413.gd'
      - 'scripts/services/generation_service_v01516.gd'
      - 'scripts/ui/workspace_v01516.gd'
      - 'scripts/main_v01516.gd'
      - 'scenes/main.tscn'
      - 'tools/test_v01515_blueprint_first_handoff.gd'
      - 'tools/test_v01516_generation_pipeline_restoration.gd'
      - '.github/workflows/validate-v01516-generation-pipeline-restoration.yml'
  workflow_dispatch:

jobs:
  restored-generation-pipeline:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: '4.6.3'
      GODOT_STATUS: stable
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: ./tools/setup_godot_ci.sh
      - name: Import and parse project
        run: godot --headless --path . --import
      - name: Test v0.15.16 active generation pipeline
        run: timeout 30s godot --headless --path . --script res://tools/test_v01516_generation_pipeline_restoration.gd
