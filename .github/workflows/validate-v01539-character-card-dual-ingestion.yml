name: Validate v0.15.39 Character Card Dual Ingestion

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v01539-character-card-dual-ingestion-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  character-card-dual-ingestion:
    name: Character Card Metadata + Vision
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v01539-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE_BASE_CLASS|CONFUSABLE_LOCAL_DECLARATION|Parse Error" /tmp/ccf-v01539-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Confirm import leaves checkout clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Godot import created repository-visible changes:"
            git status --short
            exit 1
          fi

      - name: Test Character Card PNG metadata + Vision dual ingestion
        run: python3 ./tools/test_v01539_character_card_dual_ingestion_strict.py

      - name: Recheck Multi-source Collaborator and UserPersona exclusion
        run: python3 ./tools/test_v01537_multi_source_collaborator_strict.py

      - name: Recheck Collaborator attachments and Vision inheritance
        run: timeout 45s godot --headless --path . --script res://tools/test_v01521_collaborator_attachments.gd

      - name: Recheck visible Vision analysis pipeline
        run: timeout 45s godot --headless --path . --script res://tools/test_v01511_visible_vision_analysis.gd

      - name: Recheck v0.15.38 Image Studio Character picker
        run: python3 ./tools/test_v01538_image_studio_character_picker_strict.py

      - name: Recheck Safe Section field identity/contamination guard
        run: python3 ./tools/test_v01537_hotfix1_safe_section_contamination_strict.py

      - name: Recheck update.sh project.godot preservation
        run: bash ./tools/test_update_sh_project_godot.sh

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v01539.json --profile quick --godot "$(command -v godot)"
