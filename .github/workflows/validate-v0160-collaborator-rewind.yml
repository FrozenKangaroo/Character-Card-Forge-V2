name: Validate v0.16.0 Collaborator Rewind

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0160-collaborator-rewind-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  collaborator-rewind:
    name: Character Collaborator Delete From Here
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0160-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE_BASE_CLASS|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|Parse Error" /tmp/ccf-v0160-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run v0.16.0 Collaborator rewind regression
        run: godot --headless --path . --script res://tools/test_v0160_collaborator_rewind.gd

      - name: Recheck hotfix7 Diagnostics safety
        run: godot --headless --path . --script res://tools/test_v01540_hotfix7_lightweight_diagnostics.gd

      - name: Recheck hotfix6 Collaborator sidebar/composer contract
        run: godot --headless --path . --script res://tools/test_v01540_hotfix6_scrollable_source_sidebar.gd

      - name: Recheck Character Card metadata + Vision ingestion
        run: godot --headless --path . --script res://tools/test_v01539_character_card_dual_ingestion.gd

      - name: Confirm v0.16.0 compatibility layer remains available
        shell: bash
        run: |
          test -f scripts/main_v0160.gd
          grep -F 'BUILD_DISPLAY_VERSION_V0160 := "0.16.0"' scripts/main_v0160.gd
          grep -F 'character_collaborator_window_v0160.gd' scripts/ui/workspace_v0160.gd

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0160.json --profile quick --godot "$(command -v godot)"
