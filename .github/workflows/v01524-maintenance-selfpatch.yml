name: v0.15.24 maintenance self-patch

on:
  push:
    branches:
      - agent/v0.15.24-live-generation-service-hotfix
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v01524-selfpatch]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.15.24-live-generation-service-hotfix
          fetch-depth: 0

      - name: Apply focused source and roadmap cleanup
        shell: python
        run: |
          from pathlib import Path

          service_path = Path('scripts/services/generation_service_v01522.gd')
          service = service_path.read_text(encoding='utf-8')
          old_decl = 'var name := header_text.substr(0, separator).strip_edges().to_lower()'
          new_decl = 'var header_name := header_text.substr(0, separator).strip_edges().to_lower()'
          if old_decl not in service:
              raise SystemExit('Expected shadowing declaration was not found')
          service = service.replace(old_decl, new_decl, 1)
          old_use = 'if name not in ["authorization", "proxy-authorization", "x-api-key", "api-key"]:'
          new_use = 'if header_name not in ["authorization", "proxy-authorization", "x-api-key", "api-key"]:'
          if old_use not in service:
              raise SystemExit('Expected shadowing variable use was not found')
          service = service.replace(old_use, new_use, 1)
          service_path.write_text(service, encoding='utf-8')

          roadmap_path = Path('roadmap.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          roadmap = roadmap.replace(
              '**v0.15.22 development candidate — Safe Section Build + Generation Diagnostics**',
              '**v0.15.24 development candidate — live Safe Section generation-service hotfix**',
              1,
          )
          phase_anchor = (
              'v0.15.22 makes generation reliability an explicit provider-level strategy rather than overloading the existing Full/Lite/Compact Lite writing mode. '
          )
          if phase_anchor not in roadmap:
              raise SystemExit('Current-phase roadmap anchor was not found')
          phase_note = (
              'v0.15.23 restored the Text context-window control and large Maximum Output Token range after the v0.15.22 settings view accidentally skipped the newer settings inheritance chain. '
              'v0.15.24 fixes the separate live runtime wiring regression where Generate Character could still hold a legacy v0.14.3 generation-service instance even though the v0.15.22 strategy-aware service class itself was correct. '\
              '\n\n'
          )
          roadmap = roadmap.replace(phase_anchor, phase_note + phase_anchor, 1)
          roadmap = roadmap.replace(
              'The running development build displays **v0.15.22**.',
              'The running development build displays **v0.15.24**.',
              1,
          )
          completed_anchor = '### v0.15.22 — Safe Section Build + Generation Diagnostics\n'
          if completed_anchor not in roadmap:
              raise SystemExit('Completed-section roadmap anchor was not found')
          completed_text = '''### v0.15.24 — Live Safe Section Generation-Service Hotfix

- Fixed **Generate Character** crashing with `Nonexistent function queue_character_generation_with_strategy` when the visible v0.15.22 Workspace still retained a legacy `CCFGenerationServiceV0143` runtime instance.
- Added a v0.15.24 Workspace guard that verifies the strategy-aware generation service after inherited startup and again immediately before Generate Character delegates to Safe Section Build / Fast Full Card.
- If an obsolete service instance is present, CCF reinstalls the v0.15.22 service and rebinds generation clients instead of attempting a method call on an incompatible service.
- Added a real-main-scene integration regression that instantiates `scenes/main.tscn`, finds the actual live Workspace, and asserts its `_generation_service` exposes `queue_character_generation_with_strategy` and Generation Diagnostics. This closes the coverage gap in v0.15.22, whose focused test validated the new service class directly but not the instance installed in the running app.
- Removed the `SHADOWED_VARIABLE_BASE_CLASS` warning in Generation Diagnostics redaction by renaming the local HTTP-header `name` variable so it no longer collides with `Node.name`.
- Advanced the representative regression manifest to v0.15.24 so the v0.15.23 settings regression and the live generation-service wiring regression are part of broad release coverage.

### v0.15.23 — Token Settings Regression Fix

- Restored the Text-model **Context window tokens** control that disappeared when the v0.15.22 Generation Strategy settings subclass inherited the old base settings view instead of the newer versioned settings chain.
- Restored the v0.15.2 large-output behaviour: Maximum Output Tokens again has a 4,194,304 UI range with `allow_greater`, rather than silently returning to the old 131,072 ceiling.
- Preserved the separate Vision context-window and Vision maximum-output controls from v0.15.9 while retaining the v0.15.22 Generation Strategy UI.
- Added focused regression coverage for the settings inheritance chain so future settings extensions cannot silently drop newer provider controls.

'''
          roadmap = roadmap.replace(completed_anchor, completed_text + completed_anchor, 1)
          roadmap = roadmap.replace(
              'The standalone v0.15.12–v0.15.14 full-Workspace synthesis shortcut is not the normal Generate Character path in v0.15.22',
              'The standalone v0.15.12–v0.15.14 full-Workspace synthesis shortcut is not the normal Generate Character path in v0.15.24',
              1,
          )
          roadmap_path.write_text(roadmap, encoding='utf-8')

          test_path = Path('tools/test_v01524_warning_hygiene.gd')
          test_path.write_text('''extends SceneTree\n\n\nfunc _init() -> void:\n\tvar source := FileAccess.get_file_as_string("res://scripts/services/generation_service_v01522.gd")\n\tassert(not source.contains("var name := header_text.substr"), "Generation Diagnostics redaction must not shadow Node.name.")\n\tassert(source.contains("var header_name := header_text.substr"), "The HTTP header variable should use the warning-safe header_name identifier.")\n\tprint("v0.15.24 generation warning hygiene regression passed")\n\tquit(0)\n''', encoding='utf-8')

          workflow_path = Path('.github/workflows/validate-v01524-live-generation-service.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          needle = '      - name: Recheck Safe Section generation\n        run: timeout 30s godot --headless --path . --script res://tools/test_v01522_safe_section_generation.gd\n'
          insertion = '      - name: Check generation warning hygiene\n        run: timeout 30s godot --headless --path . --script res://tools/test_v01524_warning_hygiene.gd\n\n' + needle
          if 'Check generation warning hygiene' not in workflow:
              if needle not in workflow:
                  raise SystemExit('v0.15.24 workflow insertion anchor was not found')
              workflow = workflow.replace(needle, insertion, 1)
              workflow_path.write_text(workflow, encoding='utf-8')

      - name: Commit focused cleanup
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No cleanup changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/services/generation_service_v01522.gd roadmap.md tools/test_v01524_warning_hygiene.gd .github/workflows/validate-v01524-live-generation-service.yml
          git commit -m "Finish v0.15.24 warning and roadmap cleanup [v01524-selfpatch]"
          git push origin HEAD:agent/v0.15.24-live-generation-service-hotfix
