name: Validate v0.18.2 Card Health Inspection

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0182-card-health-inspection-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  card-health-inspection:
    name: Health, Tokens, Import, Assets and Live UI
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0182-import/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0182-import/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0182-import/config
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0182-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE|SHADOWED_GLOBAL_IDENTIFIER|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|INTEGER_DIVISION|Parse Error" /tmp/ccf-v0182-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run focused Card Inspector regression
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0182-focused/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0182-focused/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0182-focused/config
        run: timeout 300s godot --headless --path . --script res://tools/test_v0182_card_health_inspection.gd

      - name: Recheck revision safety
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0181/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0181/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0181/config
        run: timeout 240s godot --headless --path . --script res://tools/test_v0181_revision_safety.gd

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0182.json --profile quick --godot "$(command -v godot)"
