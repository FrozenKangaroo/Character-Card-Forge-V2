name: Validate v0.18.0-hotfix2 GitHub Update Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0180-hotfix2-github-update-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  github-update-checks:
    name: Versions, Privacy, Platform Assets and Live UI
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0180-hotfix2-import/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0180-hotfix2-import/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0180-hotfix2-import/config
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0180-hotfix2-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE|SHADOWED_GLOBAL_IDENTIFIER|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|INTEGER_DIVISION|Parse Error" /tmp/ccf-v0180-hotfix2-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run focused GitHub update-check regression
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0180-hotfix2-focused/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0180-hotfix2-focused/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0180-hotfix2-focused/config
        run: timeout 180s godot --headless --path . --script res://tools/test_v0180_hotfix2_github_update_checks.gd

      - name: Recheck Safe Section text recovery
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0180-hotfix1/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0180-hotfix1/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0180-hotfix1/config
        run: timeout 180s godot --headless --path . --script res://tools/test_v0180_hotfix1_safe_text_recovery.gd

      - name: Recheck Front Porch Worlds
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0180/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0180/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0180/config
        run: timeout 240s godot --headless --path . --script res://tools/test_v0180_front_porch_worlds.gd

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0180.json --profile quick --godot "$(command -v godot)"
