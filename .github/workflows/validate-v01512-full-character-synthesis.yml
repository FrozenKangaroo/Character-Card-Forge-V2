name: Validate v0.15.12 full character synthesis

on:
  pull_request:
    paths:
      - 'scripts/services/generation_service_v01512.gd'
      - 'scripts/ui/workspace_v01512.gd'
      - 'scripts/main_v01512.gd'
      - 'scenes/main.tscn'
      - 'tools/test_v01512_full_character_synthesis.gd'
      - 'tools/test_v01511_visible_vision_analysis.gd'
      - '.github/workflows/validate-v01512-full-character-synthesis.yml'
  workflow_dispatch:

jobs:
  full-character-synthesis:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: '4.6.3'
      GODOT_STATUS: stable
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: ./tools/setup_godot_ci.sh
      - name: Import and parse project
        run: godot --headless --path . --import
      - name: Test v0.15.12 full character synthesis
        run: timeout 30s godot --headless --path . --script res://tools/test_v01512_full_character_synthesis.gd
