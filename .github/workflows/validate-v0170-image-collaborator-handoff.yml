name: Validate v0.17.0 Image Collaborator Handoff

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0170-image-collaborator-handoff-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  image-collaborator-handoff:
    name: Structured Source, Target Modes, Vision Boundary and Safety
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0170-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE_BASE_CLASS|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|INTEGER_DIVISION|Parse Error" /tmp/ccf-v0170-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run focused v0.17.0 regression
        run: timeout 150s godot --headless --path . --script res://tools/test_v0170_image_collaborator_handoff.gd

      - name: Recheck v0.16.10 Studio result workflow
        run: timeout 150s godot --headless --path . --script res://tools/test_v01610_studio_workflow_results.gd

      - name: Recheck v0.15.39 Character Card and Vision separation
        run: timeout 120s godot --headless --path . --script res://tools/test_v01539_character_card_dual_ingestion.gd

      - name: Recheck v0.16.0 Collaborator rewind
        run: timeout 120s godot --headless --path . --script res://tools/test_v0160_collaborator_rewind.gd

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0170.json --profile quick --godot "$(command -v godot)"
