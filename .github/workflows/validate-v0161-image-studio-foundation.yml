name: Validate v0.16.1 Image Studio Foundation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0161-image-studio-foundation-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  image-studio-foundation:
    name: Image Studio 2 capability architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0161-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE_BASE_CLASS|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|Parse Error" /tmp/ccf-v0161-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run v0.16.1 Image Studio foundation regression
        run: godot --headless --path . --script res://tools/test_v0161_image_studio_foundation.gd

      - name: Recheck v0.16.0 Collaborator rewind
        run: godot --headless --path . --script res://tools/test_v0160_collaborator_rewind.gd

      - name: Recheck Character Card metadata + Vision ingestion
        run: godot --headless --path . --script res://tools/test_v01539_character_card_dual_ingestion.gd

      - name: Confirm v0.16.1 shell wiring
        shell: bash
        run: |
          grep -F 'res://scripts/main_v0161.gd' scenes/main.tscn
          grep -F 'BUILD_DISPLAY_VERSION_V0161 := "0.16.1"' scripts/main_v0161.gd
          grep -F 'image_generation_window_v0161.gd' scripts/main_v0161.gd
          grep -F 'regression_suites_v0161.json' tools/run_regression_suite.py

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0161.json --profile quick --godot "$(command -v godot)"
