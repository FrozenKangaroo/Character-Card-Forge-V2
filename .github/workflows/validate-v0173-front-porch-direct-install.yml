name: Validate v0.17.3 Front Porch Direct Install

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0173-front-porch-direct-install-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  front-porch-direct-install:
    name: Auth, Collision Review, API Boundary and Fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0173-import/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0173-import/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0173-import/config
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0173-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE_BASE_CLASS|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|INTEGER_DIVISION|Parse Error" /tmp/ccf-v0173-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run focused v0.17.3 regression
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0173-focused/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0173-focused/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0173-focused/config
        run: timeout 180s godot --headless --path . --script res://tools/test_v0173_front_porch_direct_install.gd

      - name: Recheck v0.17.2 Front Porch character extensions
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0172-front-porch/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0172-front-porch/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0172-front-porch/config
        run: timeout 180s godot --headless --path . --script res://tools/test_v0172_front_porch_extensions.gd

      - name: Recheck inheritance-depth regression
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0156-rich-text/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0156-rich-text/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0156-rich-text/config
        run: timeout 120s godot --headless --path . --script res://tools/test_v0156_collaborator_rich_text_artifacts.gd

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0173.json --profile quick --godot "$(command -v godot)"
