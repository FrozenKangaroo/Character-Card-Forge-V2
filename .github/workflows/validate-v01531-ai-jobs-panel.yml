name: Validate v0.15.31 AI Jobs panel

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v01531-ai-jobs-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.6.3'
  GODOT_STATUS: stable

jobs:
  ai-jobs-panel:
    name: AI Jobs visibility and per-job cancellation
    runs-on: ubuntu-24.04
    timeout-minutes: 22

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v01531-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE_BASE_CLASS" /tmp/ccf-v01531-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Confirm import leaves checkout clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Godot import created repository-visible changes:"
            git status --short
            exit 1
          fi

      - name: Test AI Jobs panel and per-job cancellation
        run: python3 ./tools/test_v01531_ai_jobs_panel_strict.py

      - name: Recheck v0.15.30 Image Prompt wrapping
        run: python3 ./tools/test_v01530_image_prompt_word_wrap_strict.py

      - name: Recheck v0.15.29 embedded Image Studio and AI prompt generation
        run: python3 ./tools/test_v01529_image_studio_regressions_strict.py

      - name: Recheck v0.15.28 live project and Image profile state
        run: python3 ./tools/test_v01528_image_studio_state_strict.py

      - name: Recheck v0.15.27 runtime lifecycle cleanup
        run: python3 ./tools/test_v01527_runtime_cleanup_strict.py

      - name: Recheck v0.15.26 scheduler behavior
        run: python3 ./tools/test_v01526_concurrent_ai_scheduler_strict.py

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --profile quick --godot "$(command -v godot)"
