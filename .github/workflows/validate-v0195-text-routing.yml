name: Validate v0.19.5 Text Routing and Fallback

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0195-text-routing-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  text-routing:
    name: Task Routes and Bounded Fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0195-import/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0195-import/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0195-import/config
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0195-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|UNUSED_VARIABLE|SHADOWED_VARIABLE|SHADOWED_GLOBAL_IDENTIFIER|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|INTEGER_DIVISION|Parse Error" /tmp/ccf-v0195-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run focused Text-routing regression
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0195-focused/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0195-focused/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0195-focused/config
        run: timeout 360s godot --headless --path . --script res://tools/test_v0195_text_routing.gd

      - name: Recheck AI Review and Front Porch field generation
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0183/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0183/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0183/config
        run: |
          timeout 360s godot --headless --path . --script res://tools/test_v0183_ai_review.gd
          timeout 360s godot --headless --path . --script res://tools/test_v0172_front_porch_extensions.gd

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0195.json --profile quick --godot "$(command -v godot)"
