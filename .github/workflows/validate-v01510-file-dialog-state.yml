name: Validate v0.15.10 FileDialog state

on:
  pull_request:
    paths:
      - 'scripts/services/file_dialog_state_service_v01510.gd'
      - 'scripts/main_v01510.gd'
      - 'scenes/main.tscn'
      - 'tools/test_v01510_file_dialog_state.gd'
      - '.github/workflows/validate-v01510-file-dialog-state.yml'
  workflow_dispatch:

jobs:
  file-dialog-state:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: '4.6.3'
      GODOT_STATUS: stable
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: ./tools/setup_godot_ci.sh
      - name: Import and parse project
        run: godot --headless --path . --import
      - name: Test v0.15.10 FileDialog persistence
        run: timeout 30s godot --headless --path . --script res://tools/test_v01510_file_dialog_state.gd
