name: Validate v0.15.37 Multi-source Collaborator

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v01537-multi-source-collaborator-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  multi-source-collaborator:
    name: Multi-source Collaborator
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v01537-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE_BASE_CLASS|Parse Error" /tmp/ccf-v01537-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Confirm import leaves checkout clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Godot import created repository-visible changes:"
            git status --short
            exit 1
          fi

      - name: Test multi-source Collaborator and UserPersona exclusion
        run: python3 ./tools/test_v01537_multi_source_collaborator_strict.py

      - name: Recheck empty project save guard
        run: python3 ./tools/test_v01536_hotfix3_empty_project_save_strict.py

      - name: Recheck AI Ideas agency validation
        run: python3 ./tools/test_v01536_hotfix2_idea_agency_strict.py

      - name: Recheck configured default template
        run: python3 ./tools/test_v01536_hotfix1_default_template_strict.py

      - name: Recheck Collaborator Compare and Apply
        run: python3 ./tools/test_v01536_collaborator_compare_apply_strict.py

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v01537.json --profile quick --godot "$(command -v godot)"
