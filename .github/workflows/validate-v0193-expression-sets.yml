name: Validate v0.19.3 Expression Sets

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0193-expression-sets-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  expression-sets:
    name: Managed Queue, Review and Avatar Gallery
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project with warning gate
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0193-import/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0193-import/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0193-import/config
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v0193-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|UNUSED_VARIABLE|SHADOWED_VARIABLE|SHADOWED_GLOBAL_IDENTIFIER|CONFUSABLE_LOCAL_DECLARATION|INCOMPATIBLE_TERNARY|INTEGER_DIVISION|Parse Error" /tmp/ccf-v0193-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Run focused Expression Set regression
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0193-focused/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0193-focused/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0193-focused/config
        run: timeout 360s godot --headless --path . --script res://tools/test_v0193_expression_sets.gd

      - name: Recheck Front Porch Avatar Gallery
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0175/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0175/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0175/config
        run: timeout 360s godot --headless --path . --script res://tools/test_v0175_front_porch_avatar_galleries.gd

      - name: Recheck explicit image inputs
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v0168/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v0168/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v0168/config
        run: timeout 360s godot --headless --path . --script res://tools/test_v0168_image_inputs.gd

      - name: Recheck result provenance workflow
        env:
          CCF_REGRESSION_RUN: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/ccf-v01610/data
          XDG_CACHE_HOME: ${{ runner.temp }}/ccf-v01610/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/ccf-v01610/config
        run: timeout 360s godot --headless --path . --script res://tools/test_v01610_studio_workflow_results.gd

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v0193.json --profile quick --godot "$(command -v godot)"
