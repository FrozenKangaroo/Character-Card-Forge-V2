name: Validate v0.15.27 runtime cleanup

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v01527-runtime-cleanup-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.6.3'
  GODOT_STATUS: stable

jobs:
  runtime-cleanup:
    name: Warning cleanup and Collaborator lifecycle safety
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and reject reported warnings/errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v01527-import.log
          if grep -E "SHADOWED_VARIABLE_BASE_CLASS|data\.tree.*null|Invalid access to property or key ['\"]process_frame['\"]|SCRIPT ERROR:|Failed to load script" /tmp/ccf-v01527-import.log; then
            echo "Godot reported a v0.15.27-blocking warning or runtime/script error during import."
            exit 1
          fi

      - name: Confirm import leaves checkout clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Godot import created repository-visible changes:"
            git status --short
            exit 1
          fi

      - name: Test detached Collaborator scrolling and warning-clean sources
        run: python3 ./tools/test_v01527_runtime_cleanup_strict.py

      - name: Recheck concurrent scheduler and live service wiring
        run: python3 ./tools/test_v01526_concurrent_ai_scheduler_strict.py

      - name: Recheck Character generation token-budget invariant
        run: timeout 30s godot --headless --path . --script res://tools/test_v01525_generation_token_budget.gd

      - name: Recheck Safe Section generation
        run: timeout 30s godot --headless --path . --script res://tools/test_v01522_safe_section_generation.gd

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --profile quick --godot "$(command -v godot)"
