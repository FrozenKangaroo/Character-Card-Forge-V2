name: Validate v0.15.38 Image Studio Character Picker

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v01538-image-studio-character-picker-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1'
  GODOT_STATUS: stable

jobs:
  image-studio-character-picker:
    name: Image Studio Character Picker and Warning Cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project without reported warnings
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/ccf-v01538-import.log
          if grep -E "SCRIPT ERROR:|Failed to load script|SHADOWED_VARIABLE_BASE_CLASS|CONFUSABLE_LOCAL_DECLARATION|Parse Error" /tmp/ccf-v01538-import.log; then
            echo "Godot reported a script or warning failure during import."
            exit 1
          fi

      - name: Confirm Forward Plus remains the desktop default
        shell: bash
        run: |
          grep -F 'config/features=PackedStringArray("4.7", "Forward Plus")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'rendering_device/fallback_to_opengl3=true' project.godot

      - name: Confirm import leaves checkout clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Godot import created repository-visible changes:"
            git status --short
            exit 1
          fi

      - name: Test scalable Image Studio Character picker
        run: python3 ./tools/test_v01538_image_studio_character_picker_strict.py

      - name: Recheck Image Prompt word wrapping
        run: python3 ./tools/test_v01530_image_prompt_word_wrap_strict.py

      - name: Recheck embedded Image Studio and AI prompt generation
        run: python3 ./tools/test_v01529_image_studio_regressions_strict.py

      - name: Recheck Image Studio live project/provider state
        run: python3 ./tools/test_v01528_image_studio_state_strict.py

      - name: Recheck Safe Section field identity/contamination guard
        run: python3 ./tools/test_v01537_hotfix1_safe_section_contamination_strict.py

      - name: Recheck Multi-source Collaborator and UserPersona exclusion
        run: python3 ./tools/test_v01537_multi_source_collaborator_strict.py

      - name: Run quick cross-feature regression profile
        run: python3 ./tools/run_regression_suite.py --manifest ./tools/regression_suites_v01538.json --profile quick --godot "$(command -v godot)"
