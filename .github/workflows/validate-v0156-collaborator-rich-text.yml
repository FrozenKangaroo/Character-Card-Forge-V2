name: Validate v0.15.6 Collaborator rich text

on:
  pull_request:
    paths:
      - 'scripts/ui/character_collaborator_window_v0156.gd'
      - 'scripts/ui/workspace_v0156.gd'
      - 'scripts/main_v0156.gd'
      - 'scenes/main.tscn'
      - 'tools/test_v0156_collaborator_rich_text_artifacts.gd'
      - '.github/workflows/validate-v0156-collaborator-rich-text.yml'
  workflow_dispatch:

jobs:
  collaborator-rich-text:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: '4.6.3'
      GODOT_STATUS: stable
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: ./tools/setup_godot_ci.sh
      - name: Import and parse project
        run: godot --headless --path . --import
      - name: Test v0.15.6 Collaborator rich text
        run: timeout 30s godot --headless --path . --script res://tools/test_v0156_collaborator_rich_text_artifacts.gd
