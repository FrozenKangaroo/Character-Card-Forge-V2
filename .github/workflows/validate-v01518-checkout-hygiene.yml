name: Validate v0.15.18 checkout hygiene

on:
  pull_request:
    paths:
      - '.gitignore'
      - 'project.godot'
      - 'release.sh'
      - 'update.sh'
      - 'scripts/ui/workspace_v01517.gd'
      - 'scripts/main_v01518.gd'
      - 'scenes/main.tscn'
      - 'tools/test_v01518_checkout_hygiene.gd'
      - '.github/workflows/validate-v01518-checkout-hygiene.yml'
  workflow_dispatch:

jobs:
  checkout-hygiene:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: '4.6.3'
      GODOT_STATUS: stable
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: ./tools/setup_godot_ci.sh

      - name: Import and parse project
        run: godot --headless --path . --import

      - name: Confirm Godot import leaves checkout clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Godot import created repository-visible changes:"
            git status --short
            exit 1
          fi

      - name: Test v0.15.18 checkout hygiene and warning cleanup
        run: timeout 30s godot --headless --path . --script res://tools/test_v01518_checkout_hygiene.gd
